name: Build and test gprobe tools

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/test-tools.yml"
      - "attach/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/test-tools.yml"
      - "attach/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        container:
          - ubuntu-2204
          - fedora-39
    runs-on: ubuntu-latest
    container:
      image: "manjusakalza/gprobe-base-image:${{matrix.container}}"
      options: --privileged
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Configure tool build
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
            -DGPROBE_LLVM_JIT=1 \
            -DBUILD_GPROBE_DAEMON=OFF \
            -DGPROBE_ENABLE_CUDA_ATTACH=OFF
      - name: Build tool targets
        run: |
          cmake --build build --config RelWithDebInfo --target gprobe-cli-cpp gprobe-aot-cli gprobetool -j$(nproc)
      - name: Test AOT runner
        run: |
          python3 tools/aot/test_run.py build/tools/aot/gprobe-aot cc
