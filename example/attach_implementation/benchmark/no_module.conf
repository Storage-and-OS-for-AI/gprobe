pid nginx.pid;
master_process off;
# user yunwei37;
daemon off;
# [gprobe module]
# load_module nginx_plugin_output/ngx_http_gprobe_module.so;
events {
    worker_connections 768;
}
error_log ./error-log.txt error;

http {
    error_log ./error-log.txt error;
    access_log ./access-log.txt;
    server {
        root .;
        listen 9024;
        # [gprobe module]
        location / {
            # gprobe_request_filter on;
            try_files /index.html =404;
        }
    }
}
